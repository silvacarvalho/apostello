# Arquivo de configuração do Alembic para o Sistema Apostello

[alembic]
# Pasta onde ficam os scripts de migração
script_location = migrations

# Template para mensagens de log preparadas
prepend_sys_path = .

# Timezone para exibição de datas de revisão
# timezone =

# Número máximo de cabeçalhos a serem exibidos na branch
# truncate_slug_length = 40

# Formato de nomes de arquivos de migração
# file_template = %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Opções de saída de SQL
# output_encoding = utf-8

# A URL do banco será carregada dinamicamente do .env via env.py
# Deixe em branco aqui para evitar hardcode
sqlalchemy.url = 


[post_write_hooks]
# Hooks para executar após gerar migrações
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Configuração de logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
